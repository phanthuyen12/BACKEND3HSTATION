app:
  description: Trợ lý AI 3HSTATION cho widget chat website, tối ưu để tư vấn đúng
    các khóa học active trên hệ thống và tận dụng user context khi người dùng đã
    đăng nhập.
  icon: 🤖
  icon_background: '#FFEAD5'
  icon_type: emoji
  mode: advanced-chat
  name: CHATBOT VERSION 2
  use_icon_as_answer_icon: false
dependencies:
- current_identifier: null
  type: marketplace
  value:
    marketplace_plugin_unique_identifier: langgenius/openrouter:0.0.54@fea0bb6f5208e9c654bd8114c93582760994a7406355512c3381bd8b723498b7
    version: null
kind: app
version: 0.6.0
